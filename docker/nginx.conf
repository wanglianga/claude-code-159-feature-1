server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 纯前端 hash 路由，所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
